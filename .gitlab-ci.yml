prueba-instalacion:
 stage: test
 needs: ["generar"]
 script:
  - ls
 when: manual
 tags:
  - jacoco

prueba-carga-api:
 stage: test
 needs: ["generar"]
 script:
  - cd /home/labqa/k6
  - k6 run test_apik6_catalog.js
 when: manual
 tags:
  - jacoco

crear-imagen:
  stage: package
  needs: ["generar-sonarqube"]
  script:
  - export JAVA_HOME=$JAVA_HOME
  - export M2_HOME=$M2_HOME
  - export PATH=$JAVA_HOME/bin:$M2_HOME/bin:$PATH
  - mvn package
  - podman build -f src/main/docker/Dockerfile.jvm -t sri-catalogo-api-jvm .
  when: manual
  tags:
  - jacoco

tag-imagen:
  stage: package
  needs: ["crear-imagen"]
  script:
  - podman image tag sri-catalogo-api-jvm:latest 10.2.21.21:9085/qa/sri-catalogo-api-jvm:latest
  - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  - podman image push 10.2.21.21:9085/qa/sri-catalogo-api-jvm:latest
  when: manual
  tags:
  - jacoco

borrar-imagen:
  stage: deploy
  needs: ["tag-imagen"]
  script:
  - kubectl delete -f src/main/kubernetes/1-k8s-catalogo-api-deploy.yaml,src/main/kubernetes/2-k8s-catalogo-api-service.yaml,src/main/kubernetes/3-k8s-catalogo-api-ingress.yaml,src/main/kubernetes/4-k8s-catalogo-api-hpa.yaml  || true
  allow_failure: true
  when: manual
  tags:
  - jacoco

ejecutar-imagen:
  stage: deploy
  needs: ["borrar-imagen"]
  script:
  - kubectl apply -f src/main/kubernetes/1-k8s-catalogo-api-deploy.yaml,src/main/kubernetes/2-k8s-catalogo-api-service.yaml,src/main/kubernetes/3-k8s-catalogo-api-ingress.yaml,src/main/kubernetes/4-k8s-catalogo-api-hpa.yaml
  when: manual
  tags:
  - jacoco

prueba-humo-api:
  stage: testqa
  needs: ["ejecutar-imagen"]
  image: python:latest
  before_script:
  - python3.8 -m venv .venv
  - . .venv/bin/activate
  - pip3 install selenium
  - pip3 install pytest
  - pip3 install webdriver_manager
  - pip3 install --upgrade pip
  script:
  - cd /home/labqa/python
  - python3.8 test_catalogapi.py
  when: manual
  tags:
  - jacoco

ejecutar-imagen-produccion:
 stage: deploy-pro
 needs: ["prueba-humo-api"]
 script:
   - kubectl delete -f src/main/kubernetes/1-k8s-catalogo-api-deploy.yaml,src/main/kubernetes/2-k8s-catalogo-api-service.yaml,src/main/kubernetes/3-k8s-catalogo-api-ingress.yaml,src/main/kubernetes/4-k8s-catalogo-api-hpa.yaml
   - kubectl apply -f src/main/kubernetes/1-k8s-catalogo-api-deploy.yaml,src/main/kubernetes/2-k8s-catalogo-api-service.yaml,src/main/kubernetes/3-k8s-catalogo-api-ingress.yaml,src/main/kubernetes/4-k8s-catalogo-api-hpa.yaml
 when: manual
 tags:
  - run_devopsdesa