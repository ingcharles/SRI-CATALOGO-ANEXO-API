stages:
 - build
 - test
 - visualize
 - package
 - deploy
 - testqa
 - deploy-pro

#PARA GENERAR ARTEFACTOS Y REVISION DE SONAR
variables:
 #JAVA_HOME : "${JAVA_HOME}"
 #M2_HOME : "${M2_HOME}"
 JAVA_HOME: "/datos/data-qa/herramientas/jdk-repo/openjdk-21.0.2"
 M2_HOME: "/datos/data-qa/herramientas/apache-maven/apache-maven-3.9.9_sonar_243"

 #SONAR_HOME : "/opt/SDKMAN/candidates/sonar/sonar-scanner-5.0.1.3006"
 SONAR_HOME: "/datos/data-qa/herramientas/sonar-scanner/sonar-scanner-7.1.0.4889-linux-x64"
 SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
 GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
 #DEPENDENCY : "/opt/SDKMAN/candidates/java/dependency-check"
 DEPENDENCY: "/datos/data-qa/herramientas/dependency-check/dependency-check-12.1.0"

cache:
  key: "${CI_JOB_NAME}"
  paths:
    - .sonar/cache
    - .cache/pip
    - venv/
    - .scannerwork/
    - .m2/


###########1 MASTER
generar:
 stage: build
 script:
   - export JAVA_HOME=$JAVA_HOME
   - export M2_HOME=$M2_HOME
   - export PATH=$JAVA_HOME/bin:$M2_HOME/bin:$PATH
   - mvn clean install
 when: manual
 tags:
  - jacoco

generar-sonarqube:
 stage: test
 needs: ["generar"]
 script:
  - export JAVA_HOME=$JAVA_HOME
  - export M2_HOME=$M2_HOME
  - export SONAR_HOME=$SONAR_HOME
  - export DEPENDENCY=$DEPENDENCY
  - export PATH=$DEPENDENCY/bin:$JAVA_HOME/bin:$SONAR_HOME/bin:$M2_HOME/bin:$PATH
   ### DEPENDENCY CHECK ### 
  - mvn dependency:copy-dependencies
  - mkdir reports
  - dependency-check.sh -n --scan ${CI_PROJECT_DIR}/target/dependency --project "API Catalogo" -f JSON -f HTML -f XML -o reports/
  - mvn clean verify
  #- sonar-scanner -Dproject.settings=sonar-scanner.properties -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml
  - sonar-scanner -Dproject.settings=sonar-scanner.properties -Dsonar.token=$SONAR_TOKEN -Dsonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml 
 when: manual
 tags:
  - cobertura

analisis-propiedades-base-jdk21:
  stage: test
  script:
    - export JAVA_HOME="/datos/data-qa/herramientas/jdk-repo/openjdk-21.0.2"
    - export M2_HOME="/datos/data-qa/herramientas/apache-maven/apache-maven-4.0.0-rc-4"
    - export PATH=$JAVA_HOME/bin:$M2_HOME/bin:$PATH
    - mkdir ${CI_PROJECT_DIR}/reports
    - mvn versions:display-property-updates -Dmaven.version.ignore="(?i).*(alpha|beta|rc|snapshot|milestone|-m).*" > reports/propiedades-updates.txt
    - mvn versions:display-property-updates -X
  artifacts:
    name: "propiedades-updates"
    paths:
      - reports/propiedades-updates.txt
    expire_in: 7 days
  allow_failure: true
  when: manual
  tags:
   - jacoco   

