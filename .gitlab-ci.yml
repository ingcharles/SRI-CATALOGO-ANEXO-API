  stage: test
  script:
    - export JAVA_HOME="/datos/data-qa/herramientas/jdk-repo/openjdk-21.0.2"
    - export M2_HOME="/datos/data-qa/herramientas/apache-maven/apache-maven-4.0.0-rc-4"
