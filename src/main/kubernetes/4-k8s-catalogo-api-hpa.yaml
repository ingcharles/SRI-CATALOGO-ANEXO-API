apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sri-catalogo-api-jvm-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sri-catalogo-api-jvm
  minReplicas: 2
  maxReplicas: 3
  behavior:
    scaleDown:
      #selectPolicy: Disabled
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
